name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run lint, unit tests and assemble debug APK
      run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon

    - name: Upload debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vcds-mobile-usb-hex-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 30
