name: Android CI & Trace Toolchain

on:
  push:
    branches: [ master, 'feat/**' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run lint, unit tests and assemble debug APK
      run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon

    - name: Upload debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vcds-mobile-usb-hex-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 30

  trace-toolchain:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install pefile

    - name: Build D2XX Trace Shim DLL (Release)
      run: cargo build --release
      working-directory: tools/vcds/d2xx_trace

    - name: Run Trace Analyzer Unit Tests
      run: python tools/vcds/d2xx_trace/test_analyze_trace.py

    - name: Run USB PCAP Parser Unit Tests
      run: python tools/usb/test_pcap_tools.py

    - name: Verify DLL Exports Against Canonical Manifest
      run: python tools/vcds/d2xx_trace/verify_exports.py

